######### System #########
device: cuda
device_id: 1
log_wandb: True
wandb_project: DFFKE
wandb_name: Ablation - y_hat_clustering_and_y_hat_loss

algorithm: DFFKE
model_family: HtFE1

######### DFFKE Setting #########
decoder_model: LatentGenerator # LatentGenerator / ClassLatentGenerator
knowledge_exchange_rounds: 30
local_align_acc: 0.98
decoder_train_epoch: 6
FKE_epoch: 4
clustering_iteration: 100 # 100 is usually enough to have clustering network converge

# Ablation Controls
clustering_using_y: False
decoder_use_y_hat_cls_posteriori_loss: True # !!!!!!
decoder_use_y_cls_posteriori_loss: False

save_clients: False
checkpoint_dir: ./checkpoints/
######### Load Clients checkpoints #########
#load_clients: null
load_clients: ./checkpoints/warmup/
#load_clients: ./checkpoints/knowledge_exchange/